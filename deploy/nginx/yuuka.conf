# yuuka ストラングラーフィグ nginx 設定（本移行の成果物・PLAN §11.2）
#
# 旧 Node（127.0.0.1:7854）と新 Rust（127.0.0.1:7900）を別ポートで並走させ、nginx が
# `location` 単位でどちらへ流すかを制御する = ストラングラーの「絞め殺しダイヤル」。
# 切替状態はこの 1 ファイルに集中させ、ロールバックは `nginx -s reload` 1 発（§本パート結論1）。
#
# 運用手順:
#   1. あるフェーズの 3 層ゲート（型/テスト/verify・PLAN §11.1）が全て緑になったら、
#   2. 対応する `location` の `proxy_pass` を yuuka_node → yuuka_rust に切り替え（1 群ずつ）、
#   3. `nginx -t && nginx -s reload` で無停止反映、カナリア（X-Served-By / エラー率 / p95 /
#      SQLITE_BUSY 発生数）を監視、
#   4. 問題なければ次フェーズへ。異常時は該当行を yuuka_node へ戻して reload で即ロールバック。
#
# ⚠️ SQLite 単一 writer 集約（PLAN §11.4・最重要）: あるドメインの**書き込み**は Node か Rust の
#    どちらか一方のみ。ルート群を Rust に回した瞬間、そのドメインの Node ルートは死ぬ（nginx が
#    Node へ流さない）。両側書き込みは DEFERRED→write アップグレードで即 SQLITE_BUSY を招き
#    busy_timeout で解決不能。→ 書き込み系ルートの部分切替（split_clients %）は避け、エンドポイント
#    単位で一括切替する。
#
# 前提: 両 upstream は同一 server_name・同一 TLS 終端＝**同一オリジン**（__Host-yuuka-session
#       Cookie の host-only 制約・PLAN §11.3）。セッションは共有 Redis の不透明トークン参照なので
#       署名鍵共有は不要（両者が sha256(token) で Redis を引くだけ）。

upstream yuuka_node { server 127.0.0.1:7854; keepalive 32; }
upstream yuuka_rust { server 127.0.0.1:7900; keepalive 32; }

# WebSocket の hop-by-hop Upgrade/Connection を条件転送（http ブロックに 1 つ・§11.2）。
# 非 WS リクエストの keep-alive を壊さないため map で分岐する。
map $http_upgrade $connection_upgrade { default upgrade; '' close; }

server {
    listen 443 ssl http2;
    server_name yuuka.kawaii-music.moe;   # 両 upstream は同一オリジン（__Host- Cookie 前提）

    # nginx は X-Forwarded-Proto を必ず立てる（Rust の HTTPS 判定誤作動防止）。
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;

    # ── 移行済みルート群を Rust へ（フェーズ進行で 1 行ずつ解禁する。URI 無し=パス保存） ──
    # proxy_pass に URI を付けない（`http://yuuka_rust;`）= リクエスト URI がそのまま渡り、
    # 両バックエンドが同一パス空間を共有する（§11.2「末尾 URI 規約」・静かに壊れる罠に注意）。
    #
    # 既定は全て fail-safe で Node。各フェーズのゲート通過後に該当行を uncomment する。

    # Phase A（認証/セッション）: Node/Rust が同一 Redis セッションを相互に読める検証後に解禁。
    # location = /api/me                { proxy_pass http://yuuka_rust; }
    # location = /api/login             { proxy_pass http://yuuka_rust; }
    # location = /api/logout            { proxy_pass http://yuuka_rust; }
    # location ^~ /api/auth/device/     { proxy_pass http://yuuka_rust; }

    # Phase B（静的+単純ルート）: CSP/immutable/SPA fallback パリティ検証後に解禁。
    # location = /api/status            { proxy_pass http://yuuka_rust; }
    # location = /api/setup/status      { proxy_pass http://yuuka_rust; }

    # Phase C（各ドメイン route 群）: ドメインごとに 3 層ゲート + カナリア SLO 通過後、1 群ずつ。
    #   ↓ 書き込みを含むため、切替時にそのドメインの Node ルートは停止（単一 writer 集約・§11.4）。
    # location ^~ /api/tasks/           { proxy_pass http://yuuka_rust; }   # todo
    # location ^~ /api/expenses/        { proxy_pass http://yuuka_rust; }   # finance
    # location ^~ /api/schedules/       { proxy_pass http://yuuka_rust; }   # schedule
    # location ^~ /api/timeline/        { proxy_pass http://yuuka_rust; }   # timeline
    # location ^~ /api/reminders/       { proxy_pass http://yuuka_rust; }   # reminder
    # location ^~ /api/contacts/        { proxy_pass http://yuuka_rust; }   # personal
    # location ^~ /api/credentials/     { proxy_pass http://yuuka_rust; }   # credential
    # location ^~ /api/playbooks/       { proxy_pass http://yuuka_rust; }   # playbook
    # location ^~ /api/personas/        { proxy_pass http://yuuka_rust; }   # persona

    # ── WebSocket は接続が長命なので明示。移行末期（Phase H）まで Node 固定 ──
    location = /ws/chat {
        proxy_pass http://yuuka_node;          # Phase H で yuuka_rust へ最終切替
        proxy_http_version 1.1;                # nginx 1.29.7 未満は必須（以降は既定）
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;              # 既定 60s だとアイドルで切断→バックエンド ping 併用
    }

    # ── 既定フォールバック: 未指定は全て Node（フェイルセーフ・§11.2） ──
    location / { proxy_pass http://yuuka_node; }
}
