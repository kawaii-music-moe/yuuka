# ==============================================================================
# dev フロント: Vite dev server（HMR）— docker compose テンプレート（issue #57）
#
#   ブラウザ / トンネル(yuuka-dev.kawaii-music.moe)
#     └─→ 127.0.0.1:5173 (client: PWA Client の Vite・HMR) ＝ 外向きの入口はここだけ
#           ├─ /            PWA Client（client/pwa・Vue）
#           ├─ /admin/...   → 127.0.0.1:7855 (vite: 管理画面 frontend の Vite・HMR) へ proxy
#           ├─ /login       → /admin/login へ redirect
#           └─ /api         → 127.0.0.1:7856 (dev API・instance.env の HOST_PORT) へ proxy
#
#   本番（Rust が同一オリジンで / に PWA、/admin に管理画面を配信）と同じ URL 構成になる。
#   7855 は client からの proxy 先（内部用）で、トンネルは 5173 へ向ける。
#
#   dev API コンテナ（deploy/instance.sh dev …）とは別 compose プロジェクト（yuuka-dev-vite）。
#   API 側の操作に影響しない／されない。
#
#   使い方:
#     cp deploy/dev/.env.example deploy/dev/.env      # 必要に応じて編集（既定値のままでも動く）
#     docker compose -f deploy/dev/vite.compose.yml up -d
#   ※ `.env`（compose が本ファイルと同じディレクトリから自動読込）は .gitignore 済。
#     変数の意味と既定値は deploy/dev/.env.example を参照。運用手順は deploy/README.md。
#
#   - image: node:24-bookworm — Dockerfile の frontend-builder・CI と同じ Node。
#   - pnpm は Dockerfile と同じ 9.15.0 に固定（11 系は pnpm.overrides を読まず lockfile 不一致になる）。
#   - network_mode: host — Vite から dev API の 127.0.0.1:${HOST_PORT} へ届かせ、
#     トンネル（cloudflared 等）からも 127.0.0.1:VITE_CLIENT_PORT で受けられるようにするため。
#   - ソースは bind マウント。node_modules も同じディレクトリ（ホスト側 pnpm / npm と共有）に作られる。
#   - Host ヘッダ検証は両 vite.config.ts の `server.allowedHosts: true` で外してある（dev 専用）。
# ==============================================================================
name: yuuka-dev-vite

services:
  # 管理画面（frontend・Svelte）。base "/admin/" で配信し、client から /admin/... を proxy される。
  vite:
    image: node:24-bookworm
    # ソースツリー（node_modules 含む）の所有者に合わせる。root で書くとホスト側が root 所有になる。
    user: "${VITE_UID:-1000}:${VITE_GID:-1000}"
    network_mode: host
    working_dir: /src
    volumes:
      # 既定 ../.. = 本ファイルから見たリポジトリルート。別 worktree を使う場合は VITE_SRC_DIR で上書き。
      - "${VITE_SRC_DIR:-../..}:/src"
    environment:
      # 非 root ユーザーの書込先（corepack のキャッシュ用）。
      HOME: /tmp
      # pnpm の対話プロンプト（node_modules 再構築の確認等）を抑止する。
      CI: "true"
      # proxy 先 dev API（instance.env の HOST_PORT に合わせる）。
      VITE_API_TARGET: "${VITE_API_TARGET:-http://127.0.0.1:7856}"
    command:
      - sh
      - -c
      # 起動（再起動）のたびに install --frozen-lockfile を実行する。lockfile が変わっていなければ
      # 数秒で終わる no-op で、依存更新後は `restart vite` だけで node_modules が追従する。
      - >-
        corepack pnpm@9.15.0 install --frozen-lockfile &&
        exec corepack pnpm@9.15.0 exec vite --config frontend/vite.config.ts
        --host ${VITE_BIND_ADDR:-127.0.0.1} --port ${VITE_PORT:-7855} --strictPort
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # PWA Client（client/pwa・Vue）。外向きの入口（トンネルの向き先）。
  # client/pwa は pnpm workspace 外で npm（package-lock.json）管理のため npm で入れる。
  client:
    image: node:24-bookworm
    user: "${VITE_UID:-1000}:${VITE_GID:-1000}"
    network_mode: host
    working_dir: /src/client/pwa
    volumes:
      - "${VITE_SRC_DIR:-../..}:/src"
    environment:
      HOME: /tmp
      CI: "true"
      # /api の proxy 先 = dev API（client/pwa/vite.config.ts）。
      VITE_API_PROXY_TARGET: "${VITE_API_TARGET:-http://127.0.0.1:7856}"
      # /admin/... の proxy 先 = 上の vite サービス（client/pwa/vite.config.ts）。
      VITE_ADMIN_DEV_SERVER: "http://127.0.0.1:${VITE_PORT:-7855}"
    command:
      - sh
      - -c
      # `npm ci` は node_modules を毎回作り直すため、差分だけ入れる install にする
      # （package-lock.json が変わっていなければ数秒で終わる no-op）。
      - >-
        npm install --no-audit --no-fund &&
        exec npx vite
        --host ${VITE_CLIENT_BIND_ADDR:-127.0.0.1} --port ${VITE_CLIENT_PORT:-5173} --strictPort
    depends_on:
      - vite
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
