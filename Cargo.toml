# workspace ルート Cargo.toml。Phase 0（契約凍結）で新設。
# 絶対制約1（anyhow等の握り潰し禁止）の機械強制。検証: docs/rust-rewrite/verification/rpt-clippy-cargodeny.md
#
# 逸脱#1（本タスク指示）: yuuka-synapse / yuuka-crawler はまだ members に入れない（daemon 吸収は最終 Phase H）。
# また既存/独立の nested Cargo.toml（src/rust_synapse, src/rust_crawler, clients/desktop,
# .claude/worktrees 配下のコピー）を本 workspace に取り込まないよう exclude する。

[workspace]
resolver = "2"
members = [
    "crates/yuuka-core",
    "crates/yuuka-crypto",
    "crates/yuuka-db",
    "crates/yuuka-types",
    "crates/yuuka-web",
    "crates/yuuka-auth",
    "crates/yuuka-discord",
    "crates/yuuka-gemini",
    "crates/yuuka-tools",
    "crates/yuuka-services",
    "crates/yuuka-supervisor",
    "crates/yuuka-todo",
    "crates/yuuka-finance",
    "crates/yuuka-schedule",
    "crates/yuuka-timeline",
    "crates/yuuka-reminder",
    "crates/yuuka-personal",
    "crates/yuuka-credential",
    "crates/yuuka-playbook",
    "crates/yuuka-persona",
    "xtask",
]
exclude = [
    ".claude",
    "clients/desktop",
    # 逸脱#1（本ファイル冒頭）へ復帰: crawler/synapse は daemon 吸収（最終 Phase H）まで
    # workspace members に入れない。members にあると cargo deny が赤（fxhash unmaintained
    # RUSTSEC-2025-0057 / MPL-2.0 ×4 未許可 / license 欄欠落で unlicensed）になるため exclude へ戻す。
    # 取り込みは Phase H で license 欄追加 + deny.toml 調整とセットで行う（remaining-work.md P1-7）。
    "src/rust_crawler",
    "src/rust_synapse",
]

[workspace.package]
edition = "2021"            # オープン決定事項#4（2021 か 2024 か）: 既定 2021 を採用
rust-version = "1.96"
license = "MIT"            # プロジェクト方針（package.json）に一致。全メンバーが継承。
publish = false           # 第一者クレートは crates.io へ公開しない。

# ── 自己復帰の前提: パニックは unwind（abort にしない） ──
# tokio がタスク境界でパニックを隔離できるのは unwind のときだけ。
# 検証: docs/rust-rewrite/verification/rpt-resilience-tokio-backon-recloser.md §1
[profile.release]
panic = "unwind"
[profile.dev]
panic = "unwind"

# ── 絶対制約1: 握り潰し系 lint を workspace 全体で deny ──
# restriction グループは一括有効化禁止（相互矛盾を含むため個別列挙が必須）。
# 各メンバー crate は [lints] workspace = true を必ず書くこと。
[workspace.lints.clippy]
unwrap_used        = "deny"
expect_used        = "deny"
panic              = "deny"
todo               = "deny"
unimplemented      = "deny"
unreachable        = "deny"
indexing_slicing   = "deny"
panic_in_result_fn = "deny"

# ── 共有依存（バージョンは 2026-07-01 実測。docs/rust-rewrite/00-decisions.md に整合） ──
[workspace.dependencies]
# foundation で実際に使う依存のみ features 展開。feature crate は Phase 0 では yuuka-core のみに依存する。
tokio                    = { version = "1.52", features = ["full"] }
thiserror                = "2.0.18"
axum                     = { version = "0.8.9", features = ["ws", "macros"] }
tower                    = "0.5"
tower-http               = { version = "0.6", features = ["fs", "compression-br", "compression-gzip", "set-header"] }  # 0.7 は axum 0.8.9 未対応の恐れ→0.6 固定
hyper                    = "1"
rusqlite                 = { version = "0.32", features = ["bundled"] }
deadpool-sqlite          = "0.13"
refinery                 = { version = "0.9", features = ["rusqlite"] }
backon                   = "1.6"                                                # backoff は RUSTSEC-2025-0012 で禁止
tokio-graceful-shutdown  = "0.19"
recloser                 = "1.4"
twilight-gateway         = "0.17"
twilight-http            = "0.17"
twilight-model           = "0.17"
twilight-cache-inmemory  = "0.17"
twilight-util            = "0.17"
reqwest                  = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls", "http2", "charset"] }  # 0.13 は存在しない（最新 0.12.x）。native-tls を避け rustls 固定
eventsource-stream       = "0.2"
serde                    = { version = "1", features = ["derive"] }
serde_json               = "1"
secrecy                  = "0.10"
ts-rs                    = "12"                                                 # オープン決定#1: utoipa 5.5 + openapi-typescript 代替
rmcp                     = { version = "2.0", features = ["client"] }
extism                   = "1.30"
redis                    = { version = "0.27", features = ["tokio-comp", "connection-manager"] }  # or fred（tokio-comp + 自動再接続）
sha2                     = "0.10"                                               # セッション/デスクトップトークンの sha256hex
base64                   = "0.22"                                               # Discord 添付 → Gemini inlineData 用 base64
# ── 保存時暗号化（yuuka-crypto・Node src/utils/crypto.ts パリティ・P1-5） ──
aes-gcm                  = "0.10"                                               # AES-256-GCM（Node createCipheriv aes-256-gcm 相当・12B IV / 16B tag）
scrypt                   = "0.11"                                               # システム鍵導出（Node crypto.scryptSync 既定 N=16384/r=8/p=1）
argon2                   = "0.5"                                                # ユーザー鍵導出（Node @node-rs/argon2 hashRawSync・Argon2id m=19456/t=2/p=1）
hex                      = "0.4"                                                # 暗号文/IV/authTag の hex 表現（Node の hex 文字列と相互運用）
getrandom                = "0.2"                                                # IV（12B CSPRNG）生成
regex                    = "1"                                                  # Discord 非対応 Markdown 変換（toDiscordMarkdown 移植）
async-trait              = "0.1"
tracing                  = "0.1"
tracing-subscriber       = { version = "0.3", features = ["env-filter", "fmt"] }
serde_yaml               = "0.9"
chrono                   = { version = "0.4", default-features = false, features = ["clock", "std"] }  # cron スケジューラのローカル壁時計（node-cron はローカル時刻）。SQLite datetime とは別用途
croner                   = "2"                                                  # 5-field cron 式の次回発火計算（node-cron / cron-parser パリティ）

# yuuka クレート間の内部依存（パス依存）
yuuka-core   = { path = "crates/yuuka-core" }
yuuka-crypto = { path = "crates/yuuka-crypto" }
yuuka-db    = { path = "crates/yuuka-db" }
yuuka-types = { path = "crates/yuuka-types" }
yuuka-web        = { path = "crates/yuuka-web" }
yuuka-auth       = { path = "crates/yuuka-auth" }
yuuka-tools      = { path = "crates/yuuka-tools" }
yuuka-gemini     = { path = "crates/yuuka-gemini" }
yuuka-discord    = { path = "crates/yuuka-discord" }
yuuka-todo       = { path = "crates/yuuka-todo" }
yuuka-finance    = { path = "crates/yuuka-finance" }
yuuka-schedule   = { path = "crates/yuuka-schedule" }
yuuka-timeline   = { path = "crates/yuuka-timeline" }
yuuka-reminder   = { path = "crates/yuuka-reminder" }
yuuka-personal   = { path = "crates/yuuka-personal" }
yuuka-credential = { path = "crates/yuuka-credential" }
yuuka-playbook   = { path = "crates/yuuka-playbook" }
yuuka-persona    = { path = "crates/yuuka-persona" }
yuuka-services   = { path = "crates/yuuka-services" }
