# ==============================================================================
# Yuuka - パラメータ化 docker-compose
# 1つの定義を複数インスタンス（prod / dev / ...）で使い回す。
# インスタンス固有値は deploy/<name>/instance.env（--env-file で注入）と
# deploy/<name>/secret.key（暗号化シークレット、シェル経由でパススルー）で与える。
#
#   起動例:  ./deploy/instance.sh prod up -d
#            ./deploy/instance.sh dev  up -d
#
# 重要: 暗号化シークレットは "$" 等を含むため compose の変数展開を通さず、
#       environment の pass-through 形式（値なし）でホスト環境変数から literal 注入する。
#       instance.sh が `export YUUKA_ENCRYPTION_SECRET="$(cat secret.key)"` してから呼ぶ。
#
# ネットワーク: 既定 bridge の subnet を `DOCKER_NET_SUBNET`（instance.env）で固定する（#51）。
#       未固定だとネットワーク再作成のたびに Docker ゲートウェイ IP が変わりうるため、
#       cloudflared 等のリバースプロキシ経由リクエストを信頼する `TRUSTED_PROXIES` が
#       ズレて機能しなくなる（＝XFF が信頼されず全リクエストがゲートウェイ IP に化ける）。
#       prod/dev で必ず別サブネットを instance.env に設定すること（重複させない）。
# ==============================================================================

services:
  app:
    image: yuuka:latest
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    init: true
    user: "${PUID:-1000}:${PGID:-1000}"
    environment:
      # pass-through（compose の変数展開を回避し literal で渡す）
      - YUUKA_ENCRYPTION_SECRET
      - YUUKA_ENCRYPTION_SECRET_NEW
      - TRUSTED_PROXIES
      # Rust イメージのとき Discord gateway を Rust に所有させる（Node イメージは無視）。
      # ホスト環境変数（instance.env の YUUKA_RUST_DISCORD）から pass-through。未設定なら渡さない
      # ＝Rust ゲート既定 off（Node が gateway 所有）。prod カットオーバーで 1 にする。
      - YUUKA_RUST_DISCORD
      # ログレベル（tracing EnvFilter）。未設定なら既定 info。障害調査時に一時的に上げる。
      - RUST_LOG
    volumes:
      - "${DATA_DIR:?set DATA_DIR in instance.env}:/app/data"
      - "${CONFIG_FILE:?set CONFIG_FILE in instance.env}:/app/config.yaml:ro"
    ports:
      - "${BIND_ADDR:-127.0.0.1}:${HOST_PORT:?set HOST_PORT in instance.env}:7854"
    healthcheck:
      # runtime イメージに curl/wget が無いため、バイナリ自身の自己診断を使う（#54）。
      test: ["CMD", "./yuuka", "--healthcheck"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    depends_on:
      redis:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # キャッシュ専用途のため永続化しない（再作成時は SQLite から再構築される）
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      start_period: 5s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  default:
    ipam:
      driver: default
      config:
        - subnet: "${DOCKER_NET_SUBNET:?set DOCKER_NET_SUBNET in instance.env, distinct per instance}"
