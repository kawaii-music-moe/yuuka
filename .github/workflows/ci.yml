name: CI

on:
  pull_request:
  push:
    branches: [develop, main]

# 同一ブランチ/PR で新しい push があれば古い実行をキャンセル
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend (svelte-check / release build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck:front
      # リリース用の重いビルドは develop -> main の PR でのみ実行する。
      - name: Build for release
        if: github.event_name == 'pull_request' && github.base_ref == 'main' && github.head_ref == 'develop'
        run: pnpm build:front

  pwa:
    name: PWA (vue-tsc / release test and build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client/pwa
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: client/pwa/package-lock.json
      - run: npm ci
      - run: npm run check
      # テストとビルドはリリース前の develop -> main の PR に集約する。
      - name: Test for release
        if: github.event_name == 'pull_request' && github.base_ref == 'main' && github.head_ref == 'develop'
        run: npm test
      - name: Build for release
        if: github.event_name == 'pull_request' && github.base_ref == 'main' && github.head_ref == 'develop'
        run: npm run build

  lint:
    name: Lint (biome)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
