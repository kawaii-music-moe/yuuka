name: PR validation

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

permissions:
  contents: read

# Cancel only superseded runs for the same PR/ref. Unrelated PRs use separate VMs.
concurrency:
  group: pr-validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_BUILD_JOBS: 1

jobs:
  validate:
    name: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      # The default PR checkout tests refs/pull/<n>/merge, not just the PR head.
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Record validation commit
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          echo "Validated commit: $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
      - uses: pnpm/action-setup@v4
        with:
          version: 9
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libssl-dev libgtk-3-dev libxdo-dev libasound2-dev libudev-dev libdbus-1-dev libwayland-dev libxkbcommon-dev
      - name: Install Rust toolchain
        run: scripts/run-build.sh rustup show active-toolchain
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          workspaces: |
            . -> target
            clients/desktop -> target
      - name: Validate gate and build-runner behavior
        run: bash scripts/test-pr-validation.sh
      - name: Install management UI dependencies
        run: scripts/run-build.sh pnpm install --frozen-lockfile
      - name: Install PWA dependencies
        run: scripts/run-build.sh npm --prefix clients/pwa ci
      - name: Format workspace
        run: scripts/run-build.sh cargo fmt --all -- --check
      - name: Format desktop client
        run: scripts/run-build.sh cargo fmt --manifest-path clients/desktop/Cargo.toml --all -- --check
      - name: Dependency policy
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
      - name: Timeline attachment schema regression
        run: scripts/run-build.sh node scripts/verify-r13.mjs
      - name: SQLite migration regression
        run: python3 scripts/verify-sd07.py
      - name: Management UI typecheck and repository lint
        run: scripts/run-build.sh pnpm check
      - name: Management UI tests
        run: scripts/run-build.sh pnpm test:front --maxWorkers=1
      - name: Development script tests
        run: scripts/run-build.sh pnpm test:dev
      - name: PWA typecheck
        run: scripts/run-build.sh npm --prefix clients/pwa run check
      - name: PWA tests
        run: scripts/run-build.sh npm --prefix clients/pwa test
      # Management UI build clears dist/public, so PWA must follow it.
      - name: Build management UI
        run: scripts/run-build.sh pnpm build:front
      - name: Build PWA
        run: scripts/run-build.sh pnpm build:pwa
      - name: Workspace clippy
        run: scripts/run-build.sh cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
      - name: Workspace tests
        run: scripts/run-build.sh cargo test --locked --workspace --all-features --no-fail-fast
      - name: Build workspace binaries
        run: scripts/run-build.sh cargo build --locked --workspace --all-features
      - name: Desktop clippy (Linux, including audio)
        run: scripts/run-build.sh cargo clippy --locked --manifest-path clients/desktop/Cargo.toml --all-targets --all-features -- -D warnings
      - name: Desktop tests (Linux, including audio)
        run: scripts/run-build.sh cargo test --locked --manifest-path clients/desktop/Cargo.toml --all-features --no-fail-fast
      - name: Build desktop client (Linux, including audio)
        run: scripts/run-build.sh cargo build --locked --manifest-path clients/desktop/Cargo.toml --all-features

  pr-gate:
    name: pr-gate
    needs: [validate]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      # No checkout or PR code needed to evaluate the validation result.
      - name: Require completed validation
        env:
          VALIDATION_RESULT: ${{ needs.validate.result }}
        run: |
          if [ "$VALIDATION_RESULT" != success ]; then
            echo "Required validation did not succeed: $VALIDATION_RESULT" >&2
            exit 1
          fi
