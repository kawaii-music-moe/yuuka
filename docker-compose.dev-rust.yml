# ==============================================================================
# Rust dev 隔離オーバーレイ
# ------------------------------------------------------------------------------
# base の docker-compose.yml は `image: yuuka:latest` を全インスタンス共有で使う
# （prod もこのタグ）。dev を Rust へ置き換える際、標準の `deploy/instance.sh dev update`
# はこの yuuka:latest を再ビルドしてしまい、prod の次回再作成時に dev/feature ビルドへ
# 差し替わる副作用がある。それを避けるため、dev は **専用タグ yuuka:dev-rust** で起動する。
#
# 使い方は deploy/README.md「dev インスタンス」を参照。
# Discord を live 化する場合は instance.env に `YUUKA_RUST_DISCORD=1` を置く。
# ==============================================================================

services:
  app:
    image: yuuka:dev-rust
    pull_policy: never
    environment:
      # dev Discord bot を Rust で live 化（instance.env の YUUKA_RUST_DISCORD から補間・既定 0=off）。
      - YUUKA_RUST_DISCORD=${YUUKA_RUST_DISCORD:-0}
