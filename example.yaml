# ==============================================================================
# Yuuka - Discord Gemini Secretary Bot Configuration
# ==============================================================================
# システム全体設定（全ユーザー共有）
# ユーザー別の設定（Gemini API Key/Model、Google OAuth等）は管理画面から設定します。
#
# これはローカル/開発でバックエンドを直接（Docker を使わず）動かす場合のテンプレートです
# （docs/guide/setup.md 参照）。Docker デプロイでは同じスキーマの deploy/<instance>/config.yaml.example
# （instance ごとのポート・招待コード・BASE_URL 等をあらかじめ埋めたもの）を使います。
# 項目を追加・変更する場合は crates/yuuka-core/src/config.rs の Config 構造体が定義の正であり、
# 対応するキーはこの 3 ファイル（本ファイル / deploy/dev/config.yaml.example / deploy/prod/config.yaml.example）
# で揃えてください。
# ==============================================================================


# データベースファイルの保存パス
DB_PATH: "./data/yuuka.db"

# ==============================================================================
# 保存時暗号化シークレット (Encryption at Rest)
# ==============================================================================
# 保存時暗号化のマスターシークレット YUUKA_ENCRYPTION_SECRET 【必須】は、このファイルではなく
# 実環境変数で設定します（バックエンドは .env を自動読込しません。docs/guide/setup.md 参照）。
# .env.example を参考に、値は export するか systemd の Environment= 等で渡してください。

# ==============================================================================
# 動作チューニング
# ==============================================================================
# 返信チェーン解決の最大遡り深度（無限ループ防止）。
# 注意: 現在の Rust バックエンドは返信チェーン解決そのものを未実装のため、この値は読まれません
# （Node 版の名残。crates/yuuka-core/src/config.rs の Config には対応フィールドがありません）。
REPLY_CHAIN_MAX_DEPTH: 10

# Web管理画面セッションの有効期限（日数、スライディングウィンドウ延長）
SESSION_TTL_DAYS: 7

# 初期Adminロールを付与するDiscordユーザーID（カンマ区切り、任意。
# 未設定の場合は最初に登録したユーザーがAdminになります）
# ADMIN_DISCORD_IDS: ""

# Redis接続用URL (インメモリDBキャッシュ・セッション管理用)
REDIS_URL: "redis://127.0.0.1:6379"

# リマインダーをチェックする間隔 (cron式、デフォルトは毎分)
# 不正な式は起動時に警告を出して既定（毎分）を使います。以下のチューニング値も同様です。
REMINDER_CRON: "* * * * *"

# 会話時に思い出す過去の記憶（シナプス）の件数（1 以上）
# SYNAPSE_RECALL_K: 5
# 最近の記憶を上位へ持ち上げる重み（0 で無効）と、その効果が半分になるまでの時間（時間・0 で無効）
# SYNAPSE_RECENCY_WEIGHT: 0.15
# SYNAPSE_RECENCY_HALFLIFE_HOURS: 18

# デスクトップアプリのログイン有効期限（日数、最終利用から延長・1〜36500）
# DESKTOP_TOKEN_TTL_DAYS: 90
# デスクトップアプリのデバイス認証コードの有効期限（秒・1〜86400）
# DESKTOP_DEVICE_CODE_TTL_SEC: 600

# ==============================================================================
# 管理画面サーバー設定 (Dashboard Settings)
# ==============================================================================
# 管理画面サーバーがリスンするポート
PORT: 7854

# 管理画面サーバーがバインドするホスト名
# デフォルトはローカルからの接続のみ受け付けます (127.0.0.1)。
# Cloudflare Tunnels や Docker 等のリバースプロキシを介して公開する場合は
# すべてのインターフェース ("0.0.0.0") に変更してください。
HOST: "127.0.0.1"

# ==============================================================================
# ログイン (sk-account)
# ==============================================================================
# 本人認証は sk-account（パスキー）だけで行います。Yuuka はパスワードを持ちません。
# SK_ACCOUNT_URL はブラウザを送る公開 URL、SK_ACCOUNT_INTERNAL_URL は Yuuka サーバーから
# 認可コードを交換する内部 URL です。
SK_ACCOUNT_URL: "https://account.sk-9.net"
SK_ACCOUNT_INTERNAL_URL: "http://127.0.0.1:3100"
# 初回ログイン時に Admin として作成する Discord ID（任意。未設定なら最初のログイン者が Admin）
# ADMIN_DISCORD_IDS:
#   - "123456789012345678"

# ==============================================================================
# Google OAuth2 システム共通設定 (System-wide Google OAuth)
# ==============================================================================
# カレンダーやドライブの同期に使用する、システム共通のデフォルト Google OAuth2 設定です。
# Google Cloud Console (https://console.cloud.google.com/) でOAuth クライアントIDを作成し、設定してください。
# ※ ユーザー自身が管理画面の個別設定で独自のクライアント情報（Client ID/Secret）を設定した場合は、そちらが最優先されます。
GOOGLE_CLIENT_ID: ""
GOOGLE_CLIENT_SECRET: ""

# ==============================================================================
# 外部公開ベースURL設定 (External Public Base URL)
# ==============================================================================
# Google OAuth 認証時のリダイレクト先となる、外部公開用のHTTPSベースURLです。
# Cloudflare Tunnels などのリバースプロキシで公開するドメインを指定します。
BASE_URL: "https://example.com"

# ==============================================================================
# 一般公開のプライバシーポリシー (Public Privacy Policy)
# ==============================================================================
# ログイン前画面や使い方ガイドに表示する一般公開プライバシーポリシーへのリンクです。
# 空欄の場合、リンクは表示されません。デフォルトはシステム内部の "/privacy" です。
PRIVACY_POLICY_URL: "/privacy"

# 一般公開の利用規約 (Public Terms of Use)
# ログイン前画面や使い方ガイドに表示する一般公開利用規約へのリンクです。
# 空欄の場合、リンクは表示されません。デフォルトはシステム内部の "/terms" です。
TERMS_URL: "/terms"

# ==============================================================================
# Google Search Console 所有権確認設定 (Google Site Verification)
# ==============================================================================
# Google OAuth2 の同意画面（ブランディング検証）などでホームページの所有権を確認するためのトークンです。
# Google Search Console から取得した HTML タグ検証用コード（例: googleXXXXXXXXXXXX）
# またはメタタグの content 属性の値を指定します。
# 空欄の場合、メタタグは挿入されません。
GOOGLE_SITE_VERIFICATION: ""
