[package]
name = "yuuka-db"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "yuuka DB 層（rusqlite 単一writer actor + read pool + schema 互換ガード）"

# 注: refinery（前方専用マイグレーションランナー）と backon（SQLITE_BUSY リトライ）は
# Phase H / Phase 1 で導入する。移行期は Rust が DDL を一切発行せず、schema.rs の
# 互換ガード（schema_version == "17"）で fail-fast するのみ（R-1/R-4・§11.4）。

[dependencies]
yuuka-core.workspace = true
rusqlite.workspace = true          # bundled SQLite 3.54.x（rusqlite 0.41・RUSTSEC-2026-0459 修正版）
tokio.workspace = true             # writer actor の mpsc/oneshot・read pool の Semaphore/spawn_blocking
tracing.workspace = true
refinery.workspace = true

# 逸脱: deadpool-sqlite は rusqlite の最新系に追随しない（0.14 でも rusqlite ^0.40 固定・libsqlite3-sys
# の links 衝突で 0.41 と両立不可）ため、read pool は内製（tokio Semaphore + コネクション freelist +
# spawn_blocking）とする。rusqlite の上限は refinery 0.10（<=0.41）で決まる。

[features]
# 他クレートの単体テスト用ヘルパ（`test_support`）。本番ビルドでは有効にしない。
test-support = []

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
