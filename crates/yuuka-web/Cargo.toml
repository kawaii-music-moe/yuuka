[package]
name = "yuuka-web"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "yuuka web 層（axum ルート/認可 extractor/静的配信/WS）"

[dependencies]
yuuka-core.workspace = true
yuuka-types.workspace = true
yuuka-db.workspace = true
axum.workspace = true
# util: 静的配信フォールバック（service_fn / ServeDir.oneshot）。
tower = { workspace = true, features = ["util"] }
tower-http.workspace = true
serde.workspace = true
serde_json.workspace = true
async-trait.workspace = true
rusqlite.workspace = true
# fs: 静的配信の index.html / 404.html 読取（Node serveStaticFile の per-request 読取と一致）。
tokio.workspace = true

[dev-dependencies]
tokio.workspace = true
tower = { workspace = true, features = ["util"] }
tempfile = "3"
rusqlite = { workspace = true }

[lints]
workspace = true
